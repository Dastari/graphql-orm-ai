name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  unit-and-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graphql-orm-ai
    steps:
      - uses: actions/checkout@v5
        with:
          path: graphql-orm-ai
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --features provider-openai,provider-anthropic,provider-xai,provider-ollama,provider-openai-compatible,local-harness
      - run: cargo test --features graphql-case-pascal --test graphql_naming
      - run: cargo check --no-default-features --features postgres
      - run: cargo check --no-default-features --features mssql
      - run: cargo clippy --all-targets --features provider-openai,provider-anthropic,provider-xai,provider-ollama,provider-openai-compatible,local-harness -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc --features provider-openai,provider-anthropic,provider-xai,provider-ollama,provider-openai-compatible,local-harness --no-deps
      - run: RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc --features graphql-case-pascal --no-deps

  postgres-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: graphql-orm-ai
    steps:
      - uses: actions/checkout@v5
        with:
          path: graphql-orm-ai
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run ORM parity against a test-owned disposable PostgreSQL container
        run: cargo test --no-default-features --features postgres,provider-openai --test postgres_parity -- --test-threads=1

  release-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graphql-orm-ai
    steps:
      - uses: actions/checkout@v5
        with:
          path: graphql-orm-ai
          fetch-depth: 0
      - run: scripts/check-release-policy.sh "${{ github.event.pull_request.base.sha }}"

  semver:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: graphql-orm-ai
          fetch-depth: 0
      - name: Create baseline worktree
        run: git -C graphql-orm-ai worktree add ../graphql-orm-ai-baseline "${{ github.event.pull_request.base.sha }}"
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          manifest-path: graphql-orm-ai/Cargo.toml
          baseline-root: graphql-orm-ai-baseline
          feature-group: default-features
