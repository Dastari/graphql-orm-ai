name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  unit-and-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graphql-orm-ai
    steps:
      - uses: actions/checkout@v5
        with:
          path: graphql-orm-ai
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: Dastari/graphql-orm
          ref: f24db2f0e64dbc939ca875984d48326f47542aeb
          path: graphql-orm
      - uses: actions/checkout@v5
        with:
          repository: Dastari/agql-auth
          ref: 2ab5dc1f963dad401a3393fd3af1392c2bb51e50
          path: agql-auth
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --features provider-openai
      - run: cargo test --features graphql-case-pascal --test graphql_naming
      - run: cargo check --no-default-features --features postgres
      - run: cargo check --no-default-features --features mssql
      - run: cargo clippy --all-targets --features provider-openai -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --features provider-openai --no-deps
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --features graphql-case-pascal --no-deps

  release-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graphql-orm-ai
    steps:
      - uses: actions/checkout@v5
        with:
          path: graphql-orm-ai
          fetch-depth: 0
      - run: scripts/check-release-policy.sh "${{ github.event.pull_request.base.sha }}"

  semver:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: graphql-orm-ai
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: Dastari/graphql-orm
          ref: f24db2f0e64dbc939ca875984d48326f47542aeb
          path: graphql-orm
      - uses: actions/checkout@v5
        with:
          repository: Dastari/agql-auth
          ref: 2ab5dc1f963dad401a3393fd3af1392c2bb51e50
          path: agql-auth
      - name: Create baseline worktree
        run: git -C graphql-orm-ai worktree add ../graphql-orm-ai-baseline "${{ github.event.pull_request.base.sha }}"
      - name: Reconstruct unpublished baseline dependency universe
        run: |
          sed -i 's/version = "0.8.0"/version = "0.9.0"/' graphql-orm-ai-baseline/Cargo.toml
          sed -i 's/version = "0.6.1"/version = "0.7.0"/' graphql-orm-ai-baseline/Cargo.toml
          grep -F 'agql-auth = { path = "../agql-auth", version = "0.9.0" }' graphql-orm-ai-baseline/Cargo.toml
          grep -F 'graphql-orm = { path = "../graphql-orm/crates/graphql-orm", version = "0.7.0", default-features = false }' graphql-orm-ai-baseline/Cargo.toml
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          manifest-path: graphql-orm-ai/Cargo.toml
          baseline-root: graphql-orm-ai-baseline
          feature-group: default-features
