[package]
name = "graphql-orm-ai"
version = "0.2.0"
edition = "2024"
authors = ["Toby Martin <toby@dastari.net>"]
description = "Project-agnostic AI agent runtime for graphql-orm applications"
license = "MIT"
repository = "https://github.com/Dastari/graphql-orm-ai"
homepage = "https://github.com/Dastari/graphql-orm-ai"
documentation = "https://docs.rs/graphql-orm-ai"
readme = "README.md"
keywords = ["ai", "graphql", "agents", "orm", "async-graphql"]
categories = ["web-programming", "api-bindings"]
publish = false

[features]
default = ["sqlite"]
sqlite = ["graphql-orm/sqlite"]
postgres = ["graphql-orm/postgres"]
mssql = ["graphql-orm/mssql"]
provider-openai = ["dep:reqwest"]
provider-anthropic = []
provider-xai = []
provider-ollama = []
provider-openai-compatible = []
graphql-case-pascal = [
  "graphql-orm/resolver-case-pascal",
  "graphql-orm/argument-case-pascal",
  "graphql-orm/field-case-pascal",
]

[dependencies]
agql-auth = { path = "../agql-auth", version = "0.8.0" }
async-graphql = { version = "7", features = ["uuid"] }
async-stream = "0.3"
async-trait = "0.1"
futures = "0.3"
graphql-orm = { path = "../graphql-orm/crates/graphql-orm", version = "0.6.1", default-features = false }
hex = "0.4"
jsonschema = { version = "0.47", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls", "stream"], optional = true }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
