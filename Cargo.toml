[package]
name = "graphql-orm-ai"
version = "0.30.0"
edition = "2024"
authors = ["Toby Martin <toby@dastari.net>"]
description = "Project-agnostic AI agent runtime for graphql-orm applications"
license = "MIT"
repository = "https://github.com/Dastari/graphql-orm-ai"
homepage = "https://github.com/Dastari/graphql-orm-ai"
documentation = "https://docs.rs/graphql-orm-ai"
readme = "README.md"
keywords = ["ai", "graphql", "agents", "orm", "async-graphql"]
categories = ["web-programming", "api-bindings"]
publish = false

[features]
default = ["sqlite"]
sqlite = ["graphql-orm/sqlite"]
postgres = ["graphql-orm/postgres"]
mssql = ["graphql-orm/mssql"]
provider-openai = ["dep:base64", "dep:reqwest"]
provider-anthropic = ["dep:reqwest"]
provider-xai = ["dep:base64", "dep:reqwest"]
provider-ollama = ["dep:base64", "dep:reqwest"]
provider-openai-compatible = ["dep:base64", "dep:reqwest"]
local-harness = []
graphql-case-pascal = [
  "graphql-orm/resolver-case-pascal",
  "graphql-orm/argument-case-pascal",
  "graphql-orm/field-case-pascal",
]

[dependencies]
agql-auth = { git = "https://github.com/Dastari/agql-auth.git", rev = "c92dcb441237bbe308499b26525945f60ffa394a", version = "0.10.0" }
async-graphql = { version = "7", features = ["uuid"] }
async-stream = "0.3"
async-trait = "0.1"
base64 = { version = "0.22", optional = true }
futures = "0.3"
graphql-orm = { git = "https://github.com/Dastari/graphql-orm.git", rev = "1e145a124e9e3f1b0ffd70165289170b627ecb73", version = "0.7.0", default-features = false }
graphql-orm-storage = { git = "https://github.com/Dastari/graphql-orm-storage.git", rev = "f1a1f06483d5fd3a0b8fd17f013b3ad4dd9849c5", version = "0.5.0", default-features = false }
hex = "0.4"
jsonschema = { version = "0.47", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls", "stream"], optional = true }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
